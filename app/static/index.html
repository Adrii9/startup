<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shared-context</title>
<link rel="stylesheet" href="/s/styles.css">
</head>
<body>

<!-- ── SIGN IN: nothing about any project is shown until this passes ─────── -->
<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="brand"><span class="brand-dot"></span>shared-context</div>
    <h1 id="loginTitle"></h1>
    <p id="loginHelp" class="login-help"></p>
    <a id="googleBtn" class="google-btn" href="/auth/google">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 38.3 44 33 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span id="googleLabel"></span>
    </a>
    <p id="googleMissing" class="login-err" hidden></p>
    <form id="devForm" class="dev-form" method="post" action="/auth/dev" hidden>
      <span id="devLabel"></span>
      <input name="name" id="devName" placeholder="Adria" autocomplete="off">
      <input type="hidden" name="next" id="devNext" value="/">
      <button class="ghost-btn small" type="submit" id="devGo"></button>
    </form>
  </div>
</div>

<!-- ── JOINING FROM AN INVITE LINK ───────────────────────────────────── -->
<div id="join" class="login" hidden>
  <div class="login-card">
    <div class="brand"><span class="brand-dot"></span>shared-context</div>
    <div id="joinBead" class="bead big"></div>
    <h1 id="joinTitle"></h1>
    <p id="joinHelp" class="login-help"></p>
    <button id="joinBtn" class="primary-btn"></button>
    <a id="joinGoogle" class="google-btn" hidden></a>
  </div>
</div>

<div id="app" hidden>

  <!-- ── LEFT RAIL: the projects this person is in ──────────────────── -->
  <aside id="sidebar">
    <div class="side-top">
      <button id="collapseBtn" class="icon-btn">
        <svg viewBox="0 0 24 24" class="ic"><path d="M4 5h16M4 12h10M4 19h16"/></svg>
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <nav id="ctxList" class="ctx-list"></nav>
    <p id="noResults" class="no-results" hidden></p>

    <div class="side-bottom">
      <button id="newProjectBtn" class="ghost-btn">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
        <span></span>
      </button>
      <div class="dropdown">
        <button id="accountBtn" class="account-btn">
          <span id="accountAvatar" class="p-bead"></span>
          <span id="accountName" class="account-name"></span>
          <svg viewBox="0 0 24 24" class="ic chev"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <div id="accountMenu" class="menu up" hidden></div>
      </div>
    </div>
  </aside>

  <!-- ── MAIN ──────────────────────────────────────────────────────── -->
  <main id="main">
    <header class="topbar">
      <div class="ws">
        <span class="dot" id="wsDot"></span>
        <h1 id="wsName"></h1>
        <span class="live" id="wsLive"></span>
        <span class="meta" id="wsMeta"></span>
      </div>

      <div class="grow"></div>

      <div id="people" class="people"></div>

      <div class="seg" id="viewSwitch">
        <button data-view="board"><svg viewBox="0 0 24 24" class="ic"><rect x="4" y="4" width="7" height="16" rx="1.5"/><rect x="13" y="4" width="7" height="9" rx="1.5"/></svg><span></span></button>
        <button data-view="graph"><svg viewBox="0 0 24 24" class="ic"><circle cx="6" cy="7" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="12" cy="17" r="2.4"/><path d="M7.7 8.6l3 6M16.6 8l-3.4 7.4M8.3 6.6h7.3"/></svg><span></span></button>
      </div>

      <button id="linkBtn" class="ghost-btn wide">
        <svg viewBox="0 0 24 24" class="ic"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <span></span>
      </button>

      <button id="settingsBtn" class="icon-btn">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4L17 7M7 17l-1.6 1.6M18.6 18.6L17 17M7 7L5.4 5.4"/></svg>
      </button>

      <div class="dropdown">
        <button id="langBtn" class="icon-btn wide-sm"><span id="langLabel">CA</span></button>
        <div id="langMenu" class="menu right" hidden></div>
      </div>
    </header>

    <section id="graphView" class="view" hidden>
      <div class="graph-tools">
        <div class="seg small" id="dimSwitch">
          <button data-dim="2">2D</button>
          <button data-dim="3">3D</button>
        </div>
        <button id="resetBtn" class="ghost-btn small"><span></span></button>
        <div id="legend" class="legend"></div>
      </div>
      <canvas id="canvas"></canvas>
      <p id="graphHint" class="graph-hint"></p>
    </section>

    <section id="boardView" class="view">
      <div class="board-scroll">
        <h2 class="rubric" id="lblStand"></h2>
        <div class="stand" id="stand"></div>
        <div class="cols">
          <div class="col">
            <h2 class="rubric" id="lblDoc"></h2>
            <div id="docCol"></div>
          </div>
          <div class="col">
            <h2 class="rubric" id="lblFeed"></h2>
            <div id="feedCol"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="emptyView" class="view empty-view" hidden>
      <div class="empty-card">
        <p id="emptyMsg"></p>
        <button id="emptyNew" class="primary-btn"></button>
      </div>
    </section>
  </main>

  <aside id="detail" class="detail">
    <button id="detailClose" class="icon-btn close">
      <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="detailBody"></div>
  </aside>
</div>

<!-- ── DIALOGS. One shell, filled per use; see openSheet() in app.js ──── -->
<div id="sheetModal" class="modal" hidden>
  <div class="sheet" id="sheet">
    <header><h3 id="sheetTitle"></h3>
      <button type="button" class="icon-btn" id="sheetClose"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
    <footer id="sheetFoot"></footer>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/s/i18n.js"></script>
<script src="/s/graph.js"></script>
<script src="/s/app.js"></script>
</body>
</html>
