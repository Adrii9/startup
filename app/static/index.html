<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared workspace</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --line: #e7e7e3; --ink: #1d1d1b;
    --dim: #77776f; --accent: #2f6f4f; --warn: #a8571f; --drop: #8a3d3d;
    --badge: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1e1e1b; --line: #302f2b; --ink: #eceae4;
      --dim: #96958c; --accent: #7fbb96; --warn: #d99a5e; --drop: #d68b8b;
      --badge: #2a2926;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, -apple-system, system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 22px 28px 18px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 19px; margin: 0; font-weight: 620; letter-spacing: -0.01em; }
  .meta { color: var(--dim); font-size: 13px; }
  .live { display: inline-flex; align-items: center; gap: 6px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .dot.stale { background: var(--dim); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  main {
    display: grid; grid-template-columns: 1fr 1fr; gap: 26px;
    max-width: 1180px; margin: 0 auto; padding: 6px 28px 60px;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  /* The standing summary leads, because what is true now outranks what happened. */
  .standing { max-width: 1180px; margin: 0 auto; padding: 26px 28px 4px; }
  .briefgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 860px) { .briefgrid { grid-template-columns: 1fr; } }
  .group {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 12px 14px;
  }
  .group h4 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--dim); font-weight: 600;
  }
  .group ul { list-style: none; margin: 0; padding: 0; }
  .group li { padding: 4px 0; font-size: 14px; border-top: 1px solid var(--line); }
  .group li:first-child { border-top: 0; }
  .group .why { color: var(--dim); }
  .group.q li { color: var(--warn); }

  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); margin: 0 0 12px; font-weight: 600;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 14px 16px; margin-bottom: 10px;
  }
  .card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 620; }
  .card p { margin: 0; white-space: pre-wrap; }
  .empty { color: var(--dim); font-style: italic; }

  .entry .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .id { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 13px; }
  .who { font-weight: 600; }
  .badge {
    background: var(--badge); color: var(--dim); border-radius: 4px;
    padding: 1px 6px; font-size: 11px; letter-spacing: .02em;
  }
  .summary { margin-top: 5px; }
  .details { margin: 6px 0 0; white-space: pre-wrap; color: var(--dim); font-size: 14px; }
  .line { margin-top: 5px; font-size: 14px; }
  .line b { font-weight: 600; }
  .wanted { color: var(--accent); }
  .dropped { color: var(--drop); }
  .supersedes { color: var(--warn); font-weight: 600; margin-top: 6px; font-size: 13px; }
  .dead { opacity: .48; }
  .dead .summary { text-decoration: line-through; }
  .deadtag { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .art { margin-top: 6px; font-size: 13px; }
  a { color: inherit; }
  footer { color: var(--dim); font-size: 12px; text-align: center; padding: 0 28px 40px; }
</style>

<header>
  <h1 id="title">Shared workspace</h1>
  <span class="meta live"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
  <span class="meta" id="counts"></span>
</header>

<section class="standing">
  <h2>Where things stand</h2>
  <div id="brief" class="briefgrid"></div>
</section>

<main>
  <section>
    <h2>Document</h2>
    <div id="doc"></div>
  </section>
  <section>
    <h2>What happened, and why</h2>
    <div id="log"></div>
  </section>
</main>

<footer>Anyone can read this page. To write into it, connect your own AI assistant.</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderDoc(sections) {
  if (!sections.length) {
    $("doc").innerHTML = '<div class="card empty">Nothing written yet.</div>';
    return;
  }
  $("doc").innerHTML = sections.map(s => `
    <article class="card">
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.content) || '<span class="empty">empty</span>'}</p>
    </article>`).join("");
}

function renderLog(events) {
  if (!events.length) {
    $("log").innerHTML = '<div class="card empty">No entries yet.</div>';
    return;
  }
  $("log").innerHTML = events.slice().reverse().map(e => {
    const bits = [];
    if (e.is_dead) bits.push('<div class="deadtag">Superseded by a later entry — no longer valid</div>');
    if (e.supersedes_id) bits.push(`<div class="supersedes">Overturns #${e.supersedes_id}</div>`);
    if (e.intent) {
      const label = e.intent_source === "stated" ? "wanted" : "assistant inferred";
      bits.push(`<div class="line wanted"><b>${label}:</b> ${esc(e.intent)}</div>`);
    }
    for (const r of e.rejected || []) {
      const why = r.reason ? ` — ${esc(r.reason)}` : "";
      bits.push(`<div class="line dropped"><b>dropped:</b> ${esc(r.option)}${why}</div>`);
    }
    if (e.artifact_url) bits.push(`<div class="art">📎 ${esc(e.artifact_url)}</div>`);
    return `
      <article class="card entry${e.is_dead ? " dead" : ""}">
        <div class="top">
          <span class="id">#${e.id}</span>
          <span class="who">${esc(e.member_name)}</span>
          <span class="badge">${esc(e.agent)}</span>
          <span class="badge">${esc(e.kind)}</span>
          ${e.section_key ? `<span class="badge">${esc(e.section_key)}</span>` : ""}
        </div>
        <div class="summary">${esc(e.summary)}</div>
        ${e.details ? `<p class="details">${esc(e.details)}</p>` : ""}
        ${bits.join("")}
      </article>`;
  }).join("");
}

// One line per item, mirroring what an assistant is handed. If this panel ever
// stops fitting on a screen, it has stopped doing its job.
function renderBrief(brief) {
  const groups = [
    ["Decisions in force", brief.decisions, ""],
    ["What we know", brief.facts, ""],
    ["Still open", brief.questions, "q"],
  ];
  const filled = groups.filter(([, items]) => items.length);
  if (!filled.length) {
    $("brief").innerHTML = '<div class="group"><ul><li class="empty">Nothing established yet.</li></ul></div>';
    return;
  }
  $("brief").innerHTML = filled.map(([label, items, cls]) => `
    <div class="group ${cls}">
      <h4>${label}</h4>
      <ul>${items.map(e => `
        <li><span class="id">#${e.id}</span> ${esc(e.summary)}${
          e.kind === "decision" && e.intent
            ? `<span class="why"> — because: ${esc(e.intent)}</span>` : ""
        }</li>`).join("")}</ul>
    </div>`).join("");
}

function apply(state) {
  document.title = state.title;
  $("title").textContent = state.title;
  $("counts").textContent =
    `${state.events.length} entries · ${state.sections.length} sections · ${state.members_active_today} active today`;
  renderBrief(state.brief);
  renderDoc(state.sections);
  renderLog(state.events);
}

function setStatus(text, stale) {
  $("status").textContent = text;
  $("dot").classList.toggle("stale", !!stale);
}

// The page lives on the same origin as the server, so a plain EventSource is
// all the live-update machinery this needs.
let source;
function connect() {
  source = new EventSource(window.location.pathname.replace(/\/$/, "") + "/events");
  source.onopen = () => setStatus("live", false);
  source.onmessage = (m) => { setStatus("live", false); apply(JSON.parse(m.data)); };
  source.onerror = () => {
    setStatus("reconnecting…", true);
    source.close();
    setTimeout(connect, 3000);
  };
}
connect();
</script>
