<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shared-context</title>
<link rel="stylesheet" href="/s/styles.css">
</head>
<body>

<div id="app" class="solo">
  <main id="main">

    <header class="topbar">
      <div class="ws">
        <h1 id="wsName"></h1>
        <span class="live" id="wsLive"></span>
        <span class="meta" id="wsMeta"></span>
      </div>

      <div class="grow"></div>

      <div class="seg" id="viewSwitch">
        <button data-view="board"><svg viewBox="0 0 24 24" class="ic"><rect x="4" y="4" width="7" height="16" rx="1.5"/><rect x="13" y="4" width="7" height="9" rx="1.5"/></svg><span></span></button>
        <button data-view="graph"><svg viewBox="0 0 24 24" class="ic"><circle cx="6" cy="7" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="12" cy="17" r="2.4"/><path d="M7.7 8.6l3 6M16.6 8l-3.4 7.4M8.3 6.6h7.3"/></svg><span></span></button>
      </div>

      <div class="dropdown">
        <button id="langBtn" class="icon-btn wide-sm"><span id="langLabel">CA</span></button>
        <div id="langMenu" class="menu right" hidden></div>
      </div>
    </header>

    <section id="graphView" class="view" hidden>
      <div class="graph-tools">
        <div class="seg small" id="dimSwitch">
          <button data-dim="2">2D</button>
          <button data-dim="3">3D</button>
        </div>
        <button id="resetBtn" class="ghost-btn small"><span></span></button>
        <div id="legend" class="legend"></div>
      </div>
      <canvas id="canvas"></canvas>
      <p id="graphHint" class="graph-hint"></p>
    </section>

    <section id="boardView" class="view">
      <div class="board-scroll">
        <h2 class="rubric" id="lblStand"></h2>
        <div class="stand" id="stand"></div>

        <div class="cols">
          <div class="col">
            <h2 class="rubric" id="lblDoc"></h2>
            <div id="docCol"></div>
          </div>
          <div class="col">
            <h2 class="rubric" id="lblFeed"></h2>
            <div id="feedCol"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <aside id="detail" class="detail">
    <button id="detailClose" class="icon-btn close" title="">
      <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="detailBody"></div>
  </aside>
</div>

<script src="/s/i18n.js"></script>
<script src="/s/graph.js"></script>
<script src="/s/app.js"></script>
</body>
</html>
